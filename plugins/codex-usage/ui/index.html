<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 额度</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#edf4fb;background:#122030}
body{margin:0;padding:16px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}h1{font-size:15px;margin:0}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.language-label{font-size:12px;color:#b1c1d1}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin:16px 0}.metric{min-width:0}.metric+.metric{border-left:1px solid #35465b;padding-left:18px}
.label{color:#b1c1d1;font-size:12px}.value{font-size:clamp(26px,7vw,48px);font-weight:750;line-height:1.35;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.accent{color:#78e6c8}body.cached .accent{color:#ffd18a}
small{color:#b1c1d1;display:block;line-height:1.6;overflow-wrap:anywhere}
button,select{font:inherit;border:1px solid #42635f;background:#204e48;color:#d8fff3;border-radius:7px;padding:7px 10px;cursor:pointer}select{background:#172e3b}
button:focus-visible,select:focus-visible{outline:3px solid #78e6c8;outline-offset:2px}button:disabled{opacity:.55}#state{margin-top:8px;color:#ffd18a}#secondary{margin-bottom:10px}#language-note{margin-top:8px;color:#ffd18a}#language-note[hidden]{display:none}
</style>
<header>
  <h1 id="title">Codex 额度</h1>
  <div class="controls">
    <label class="language-label" for="language">语言 / Language</label>
    <select id="language" aria-label="界面语言"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option></select>
    <button id="refresh" type="button">刷新</button>
  </div>
</header>
<small id="language-note" hidden></small>
<main>
  <div class="card">
    <section id="remaining-metric" class="metric" aria-label="剩余用量"><div class="label"><span id="remaining-label">用量剩余</span> <span id="duration"></span></div><div id="remaining" class="value accent">—</div></section>
    <section id="hours-metric" class="metric" aria-label="距重置小时"><div id="hours-label" class="label">距离重置（小时）</div><div id="hours" class="value">未知</div></section>
  </div>
  <small id="secondary">次要周期：未提供</small><small id="reset">重置时间：未知</small><small id="stamp">取数时间：无</small>
  <small id="source">来源：本机 Codex CLI 登录账户 · 60秒查询，非实时推送</small>
  <small id="disclaimer">不代表普通 ChatGPT 消息额度或 API 账单。</small>
  <div id="state" role="status" aria-live="polite">等待宿主连接；未连接账户</div>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const messages={
  'zh-CN':{
    title:'Codex 额度',language:'界面语言',refresh:'刷新',remainingLabel:'用量剩余',remainingAria:'剩余用量',hoursLabel:'距离重置（小时）',hoursAria:'距重置小时',
    unknown:'未知',notProvided:'未提供',awaitingRefresh:'待刷新',none:'无',duration:'· {hours}h周期',secondary:'次要周期：{value}',reset:'重置时间：{value}',stamp:'取数时间：{value}',localTime:'（本机时区）',
    source:'来源：本机 Codex CLI 登录账户 · 60秒查询，非实时推送',disclaimer:'不代表普通 ChatGPT 消息额度或 API 账单。',
    waiting:'等待宿主连接；未连接账户',unavailable:'额度不可用；请自行检查本机 CLI 登录和连接',cached:'查询失败或记录已旧，当前为缓存，请以取数时间为准',
    expired:'已到重置时间，等待新数据，不推算为100%',connected:'已连接官方额度接口（本机 CLI 账户）',
    queryFailed:'宿主连接或查询失败；保留上次记录。直接打开HTML不会连接账户。',bridgeUnavailable:'当前宿主未提供 MCP Apps 桥接；额度不可用。',
    standalone:'请在支持 MCP Apps 的本机宿主中打开。此页面未连接账户，不显示示例额度。',storageUnavailable:'此宿主不允许保存语言偏好；选择仅在本次打开期间有效。'
  },
  en:{
    title:'Codex quota',language:'Interface language',refresh:'Refresh',remainingLabel:'Remaining quota',remainingAria:'Remaining quota',hoursLabel:'Hours until reset',hoursAria:'Hours until reset',
    unknown:'Unknown',notProvided:'Not provided',awaitingRefresh:'Awaiting refresh',none:'None',duration:'· {hours}h window',secondary:'Secondary window: {value}',reset:'Reset time: {value}',stamp:'Fetched at: {value}',localTime:' (local time zone)',
    source:'Source: local Codex CLI account · queried every 60 seconds, not a live push',disclaimer:'Not ordinary ChatGPT message limits or API billing.',
    waiting:'Waiting for host connection; account not connected',unavailable:'Quota unavailable; check the local CLI sign-in and connection yourself',cached:'Query failed or record is old; showing cached data. Check the fetched time.',
    expired:'Reset time reached; waiting for new data, not assuming 100%',connected:'Connected to the official quota service (local CLI account)',
    queryFailed:'Host connection or query failed; keeping the previous record. Opening HTML directly does not connect an account.',bridgeUnavailable:'This host does not provide an MCP Apps bridge; quota unavailable.',
    standalone:'Open in a local host that supports MCP Apps. No account is connected; no sample quota is shown.',storageUnavailable:'This host cannot save the language preference; your choice lasts only while this view is open.'
  }
};
const LANGUAGE_KEY='codex-usage.language';
let language='zh-CN',storageAvailable=true;
try{const saved=window.localStorage.getItem(LANGUAGE_KEY);if(Object.hasOwn(messages,saved))language=saved;}catch{storageAvailable=false;}
const t=(key,values={})=>messages[language][key].replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??''));
let data=null,pending=false,seq=0,bridge=false,connectionState='waiting';
const calls=new Map();
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++seq,timer=setTimeout(()=>{calls.delete(id);reject(new Error('timeout'));},30000);calls.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
function consume(value){const d=value?.structuredContent||value?.result?.structuredContent||value;if(d&&['fresh','cached','unavailable'].includes(d.status)){data=d;paint();}}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;const c=calls.get(m.id);if(c){calls.delete(m.id);clearTimeout(c.timer);m.error?c.reject(new Error('host')):c.resolve(m.result);}if(m.method==='ui/notifications/tool-result')consume(m.params);});
function windowText(w){if(!w)return t('notProvided');const expired=Number.isFinite(w.resetsAt)&&w.resetsAt*1000<=Date.now();return expired?t('awaitingRefresh'):`${w.remainingPercent??'—'}%`;}
function paint(){
  if(!data){
    $('remaining').textContent='—';$('hours').textContent=t('unknown');$('duration').textContent='';
    $('secondary').textContent=t('secondary',{value:t('notProvided')});$('reset').textContent=t('reset',{value:t('unknown')});$('stamp').textContent=t('stamp',{value:t('none')});
    $('state').textContent=t(connectionState);return;
  }
  const w=data.primary||data.secondary,now=Date.now();const reset=Number.isFinite(w?.resetsAt)?new Date(w.resetsAt*1000):null;const delta=reset?(reset.getTime()-now)/3600000:null;
  $('remaining').textContent=windowText(w);$('hours').textContent=delta===null?t('unknown'):delta<=0?t('awaitingRefresh'):delta<.1?'<0.1':delta.toFixed(1);
  $('duration').textContent=w?.windowMinutes?t('duration',{hours:w.windowMinutes/60}):'';
  $('reset').textContent=t('reset',{value:reset?reset.toLocaleString(language)+t('localTime'):t('unknown')});
  $('stamp').textContent=t('stamp',{value:data.fetchedAt?new Date(data.fetchedAt).toLocaleString(language)+' / '+data.fetchedAt:t('none')});
  $('secondary').textContent=t('secondary',{value:windowText(data.secondary)});
  document.body.classList.toggle('cached',data.status==='cached');
  $('state').textContent=t(data.status==='unavailable'?'unavailable':data.status==='cached'?'cached':delta!==null&&delta<=0?'expired':'connected');
}
function applyLanguage(){
  document.documentElement.lang=language;document.title=t('title');$('language').value=language;$('language').setAttribute('aria-label',t('language'));
  for(const [id,key] of [['title','title'],['refresh','refresh'],['remaining-label','remainingLabel'],['hours-label','hoursLabel'],['source','source'],['disclaimer','disclaimer']])$(id).textContent=t(key);
  $('remaining-metric').setAttribute('aria-label',t('remainingAria'));$('hours-metric').setAttribute('aria-label',t('hoursAria'));
  $('language-note').hidden=storageAvailable;$('language-note').textContent=storageAvailable?'':t('storageUnavailable');paint();
}
$('language').addEventListener('change',()=>{
  const selected=$('language').value;if(!Object.hasOwn(messages,selected))return;language=selected;
  try{window.localStorage.setItem(LANGUAGE_KEY,language);storageAvailable=true;}catch{storageAvailable=false;}
  applyLanguage();
});
function setConnectionState(key){connectionState=key;paint();}
async function refresh(){if(pending)return;pending=true;$('refresh').disabled=true;try{const result=bridge?await rpc('tools/call',{name:'get_usage',arguments:{}}):window.openai?.callTool?await window.openai.callTool('get_usage',{}):null;if(result)consume(result);else throw new Error('host');}catch{if(data){data.status='cached';paint();}else setConnectionState('queryFailed');}finally{pending=false;$('refresh').disabled=false;}}
$('refresh').addEventListener('click',refresh);
applyLanguage();
if(parent!==window){try{await rpc('ui/initialize',{appInfo:{name:'codex-usage',version:'0.1.0-private-test.2'},appCapabilities:{},protocolVersion:'2026-01-26'});bridge=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');await refresh();}catch{if(window.openai?.callTool){consume(window.openai.toolOutput);await refresh();}else setConnectionState('bridgeUnavailable');}}
else setConnectionState('standalone');
setInterval(()=>{if(document.visibilityState==='visible'&&(bridge||window.openai?.callTool))refresh();},60000);setInterval(paint,1000);
</script>
</html>
